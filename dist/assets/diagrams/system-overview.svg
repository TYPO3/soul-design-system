<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726" role="img" aria-labelledby="ov-t ov-d">
<title id="ov-t">One line leaves the machine</title>
<desc id="ov-d">The MCP client asks the TYPO3 Support App subprocess, which draws its answers from bundled knowledge and from the project&#39;s own packages and installation — all inside the developer&#39;s machine. One read-only path crosses the boundary to fetch from official documentation and core services; nothing is written back across it.</desc>
<g id="art">
<rect width="1200" height="726" fill="var(--surface-canvas, #FBFAF7)"></rect>
<text x="60" y="60" fill="var(--accent, #FF8700)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" font-weight="600" letter-spacing="1.6">LOCAL · READ-ONLY · VERSION-AWARE</text>
<text x="60" y="108" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">One line leaves the machine</text>
<text x="60" y="140" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="17">Everything that answers a question is already on the developer’s disk. The exception is drawn as the exception.</text>
<line x1="60" y1="176" x2="1140" y2="176" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></line>

<rect x="60" y="216" width="800" height="410" rx="6" fill="none" stroke="var(--border-strong, #C9C3B7)" stroke-width="1.5"></rect>
<text x="92" y="250" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" letter-spacing="0.8">YOUR MACHINE</text>

<rect x="92" y="270" width="736" height="76" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="112" y="302" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="16" font-weight="600">MCP-enabled client</text>
<text x="112" y="326" fill="var(--text-muted, #726C63)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="13">Starts one local PHP subprocess over stdio.</text>

<path d="M460 348 V374" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>
<path d="M455 366 460 376 465 366Z" fill="var(--text-muted, #726C63)"></path><path d="M455 356 460 346 465 356Z" fill="var(--text-muted, #726C63)"></path>
<text x="478" y="366" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">question · answer</text>

<rect x="92" y="378" width="736" height="104" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="112" y="414" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="18" font-weight="700">TYPO3 Support App</text>
<text x="112" y="442" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" opacity="0.72">Routes by task, version and scope.</text>
<text x="112" y="464" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" opacity="0.72">Read-only, except feedback you ask for explicitly.</text>

<path d="M270 496 H650 M460 496 V486" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>
<path d="M455 492 460 482 465 492Z" fill="var(--text-muted, #726C63)"></path>
<rect x="92" y="510" width="356" height="86" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="112" y="542" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600">bundled knowledge</text>
<text x="112" y="568" fill="var(--text-muted, #726C63)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="13">Curated, version-bound.</text>
<path d="M270 510 V496" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>
<rect x="472" y="510" width="356" height="86" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="492" y="542" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600">packages &amp; installation</text>
<text x="492" y="568" fill="var(--text-muted, #726C63)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="13">What this checkout supplies.</text>
<path d="M650 510 V496" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>

<text x="920" y="306" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" letter-spacing="0.8">OUTSIDE</text>
<path d="M904 373 V483 M904 428 H838" stroke="var(--accent, #FF8700)" stroke-width="2" fill="none"></path>
<path d="M842 423 832 428 842 433Z" fill="var(--accent, #FF8700)"></path>
<text x="866" y="416" text-anchor="middle" fill="var(--accent, #FF8700)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">read-only</text>
<rect x="920" y="330" width="220" height="86" rx="6" fill="var(--surface-canvas, #FBFAF7)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1" stroke-dasharray="5 4"></rect>
<text x="940" y="364" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14" font-weight="600">docs.typo3.org</text>
<text x="940" y="388" fill="var(--text-muted, #726C63)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="13">Canonical documentation.</text>
<path d="M920 373 H904" stroke="var(--accent, #FF8700)" stroke-width="2" fill="none"></path>
<rect x="920" y="440" width="220" height="86" rx="6" fill="var(--surface-canvas, #FBFAF7)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1" stroke-dasharray="5 4"></rect>
<text x="940" y="474" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14" font-weight="600">core services</text>
<text x="940" y="498" fill="var(--text-muted, #726C63)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="13">Live registries and APIs.</text>
<path d="M920 483 H904" stroke="var(--accent, #FF8700)" stroke-width="2" fill="none"></path>

<line x1="60" y1="650" x2="1140" y2="650" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></line>
<text x="60" y="684" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="16" font-weight="600">Every arrow points at the app: it reads, it never writes back.</text>
<text x="60" y="710" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">Exactly one of those arrows crosses the boundary, and it carries data inwards only.</text>
</g>
</svg>
