<svg xmlns="http://www.w3.org/2000/svg" id="art" viewBox="0 0 128 100" role="img" aria-label="Soul Design System">
  <title>Soul Design System</title>
  <!-- Every colour sits on its own shape, as a var() with a hex fallback: a
       page that declares the tokens gets its own ink, and this file still
       renders on its own. Nothing colours it from a <style> or from the root,
       and no comment in here may carry a double dash, which is what makes an
       SVG malformed and a reference to it draw nothing. See
       docs/guidelines/artwork.rst. -->
  <!-- M - 20-31px. Stroke 8.5, rounding 4.25, gap 8.5.

       The crop marks keep the same outer radius of 20, which means their own
       path radius drops to 15.75 to pay for the heavier stroke. The three
       parts give up a unit each to the wider gap: 10.5 / 20.5 / 10.5. -->
  <path stroke="var(--text-primary, #8A8378)" d="M56 95.75H20A15.75 15.75 0 0 1 4.25 80V44" fill="none" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"></path>
  <rect fill="var(--text-primary, #8A8378)" x="39" y="30.5" width="10.5" height="39" rx="4.25"></rect>
  <rect fill="var(--text-primary, #8A8378)" x="53.75" y="30.5" width="20.5" height="39" rx="4.25"></rect>
  <rect fill="var(--text-primary, #8A8378)" x="78.5" y="30.5" width="10.5" height="39" rx="4.25"></rect>
  <path d="M72 4.25H108A15.75 15.75 0 0 1 123.75 20V56" fill="none" stroke="var(--accent, #FF8700)" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
