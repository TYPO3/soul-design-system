<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 100" role="img" aria-label="Soul Design System">
  <title>Soul Design System</title>
  <style>
    /* An image cannot inherit currentColor, so the ink is a mid warm grey
       that holds on both modes, lifted a step in dark. The accent is flat
       #FF8700 in both, exactly as --accent is. */
    .ink  { stroke: #8A8378; }
    .inkf { fill: #8A8378; }
    @media (prefers-color-scheme: dark) {
      .ink  { stroke: #A9A299; }
      .inkf { fill: #A9A299; }
    }
  </style>
  <!-- M - 20-31px. Stroke 8.5, rounding 4.25, gap 8.5.

       The crop marks keep the same outer radius of 20, which means their own
       path radius drops to 15.75 to pay for the heavier stroke. The three
       parts give up a unit each to the wider gap: 10.5 / 20.5 / 10.5. -->
  <path class="ink" d="M56 95.75H20A15.75 15.75 0 0 1 4.25 80V44" fill="none" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"></path>
  <rect class="inkf" x="39" y="30.5" width="10.5" height="39" rx="4.25"></rect>
  <rect class="inkf" x="53.75" y="30.5" width="20.5" height="39" rx="4.25"></rect>
  <rect class="inkf" x="78.5" y="30.5" width="10.5" height="39" rx="4.25"></rect>
  <path d="M72 4.25H108A15.75 15.75 0 0 1 123.75 20V56" fill="none" stroke="#FF8700" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
