<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 140 112" role="img" aria-label="TYPO3 Support App">
  <title>TYPO3 Support App</title>
  <style>
    /* An image cannot inherit currentColor, so the ink is a mid warm grey
       that holds on both modes, lifted a step in dark. The accent is flat
       #FF8700 in both, exactly as --accent is. */
    .ink  { stroke: #8A8378; }
    .inkf { fill: #8A8378; }
    @media (prefers-color-scheme: dark) {
      .ink  { stroke: #A9A299; }
      .inkf { fill: #A9A299; }
    }
  </style>
  <!-- L - 32px and up. Stroke 7, three lines, marker 36x52. The full statement. -->
  <path class="ink" d="M128 66.00V80A20 20 0 0 1 108 100H20A20 20 0 0 1 0 80V20A20 20 0 0 1 20 0H78.00" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"></path>
  <rect class="inkf" x="22" y="26.5" width="56" height="7" rx="3.5"></rect>
  <rect class="inkf" x="22" y="46.5" width="36" height="7" rx="3.5" opacity="0.55"></rect>
  <rect x="22" y="66.5" width="66" height="7" rx="3.5" fill="#FF8700"></rect>
  <path d="M92.00 0H108.00A20 20 0 0 1 128 20V52.00Z" fill="#FF8700" stroke="#FF8700" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
