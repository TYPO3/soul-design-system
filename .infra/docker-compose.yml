# Running the design system. Docker is the only requirement.
#
#   make              # every task
#   make storybook    # the documentation surface, on a port Docker picks
#   make verify       # the gate
#   make test         # the Playwright suite
#
# The Makefile at the repo root drives this — you should not need to type
# `docker compose` yourself.

x-app: &app
  build:
    # The repo root, so the image sees the whole tree and picks up the
    # .dockerignore that lives beside it.
    context: ..
    dockerfile: .infra/Dockerfile
    target: app
  # Run as whoever owns the working tree. Without this the container writes
  # .out/ and dist/ as root, and the next run cannot delete what the last one
  # made. scripts/task.ts fills these in.
  user: '${SDS_UID:-1000}:${SDS_GID:-1000}'
  volumes:
    # The whole project, so edits on the host are live and generated output
    # lands back on the host — .out/bundle/ especially, since /design-sync
    # uploads it from there.
    - ..:/app
    # …except these. node_modules is platform-specific and belongs to the
    # image; a host tree built on macOS would put the wrong binaries in front
    # of Linux. The rest are build output nobody needs on the host, and
    # keeping them in the container makes a rebuild cheaper.
    - /app/node_modules
    - /app/.out/storybook
  # Chromium needs more than Docker's default 64 MB of shared memory. Too
  # little shows up as tabs crashing mid-run, never as an out-of-memory error.
  shm_size: 1gb
  # An init as PID 1, whose whole job is to reap.
  #
  # `sleep infinity` is PID 1 in the app container and it reaps nothing. Every
  # Playwright run leaves chrome processes whose parent has exited, every
  # esbuild the same, and each of them is re-parented to PID 1 and stays there
  # as a zombie forever. They cost no memory and they are not free: the process
  # table is what fills up, and a container that has run the suite a few dozen
  # times gets slower at starting anything at all. Measured here at 1,580
  # zombies after a day of `make cards` and `make test`.
  #
  # `init: true` puts tini in front, which reaps them as they die. It belongs
  # on the anchor rather than on `app` alone — the storybook and dist services
  # spawn the same children.
  init: true

# Named explicitly. Compose otherwise derives the project name from the
# directory holding this file — which is now `.infra`, a name generic enough
# that a second project with the same layout would share containers and
# volumes with this one.
name: typo3-soul-design-system

services:
  # Where every task runs. It stays up and does nothing, so `make verify` and
  # the rest are an `exec` into a container that already exists rather than a
  # new one per command — the tree is bind-mounted, so a source edit is
  # already inside it and there is nothing to rebuild.
  #
  # Only two things live in the image rather than in the mount: the installed
  # dependencies and the browser. Change `package-lock.json` or the Dockerfile
  # and the container has to be rebuilt; `.infra/task.sh` notices and says so.
  app:
    <<: *app
    command: ['sleep', 'infinity']

  # The documentation surface: guidelines as written pages, components with
  # live controls.
  storybook:
    <<: *app
    build:
      context: ..
      dockerfile: .infra/Dockerfile
      target: storybook
    # The one service whose host and container port must match. Vite's HMR
    # client connects to the port Storybook was told to listen on; with Docker
    # choosing a different host port that URL does not exist, the websocket
    # fails, and hot reload dies — which for a design system means editing a
    # token and seeing nothing happen.
    #
    # So `make start` picks the free port instead of Docker, and both sides
    # get the same number. Still a free port; only who chooses it moved.
    command: ['npx', 'storybook', 'dev', '-p', '${SDS_STORYBOOK_PORT:-6007}', '-h', '0.0.0.0', '--ci', '--no-open']
    ports:
      - '${SDS_STORYBOOK_PORT:-6007}:${SDS_STORYBOOK_PORT:-6007}'

  # The rendered documentation site, at a root of its own.
  #
  # Not a static directory inside Storybook, which was the first thing tried
  # and is the wrong shape twice over. Storybook is the authoring surface *for*
  # the system; the site is a consumer of it, and borrowing that server gives
  # it Vite's routing and a sub-path it will never be served under. The four
  # defects the first render turned up were all of that family — a path that
  # resolves here and nowhere else. This serves the same bytes GitHub Pages
  # will, from `/`, with a static file server that has no opinions.
  #
  # It starts before `make guides` has ever run, and then serves nothing. That
  # is honest: an empty site is a site nobody has rendered.
  site:
    <<: *app
    command: ['node', 'scripts/serve.ts', '${SDS_SITE_PORT:-4173}', '.out/site']
    ports:
      - '${SDS_SITE_PORT:-4173}:${SDS_SITE_PORT:-4173}'

  # The drop-in, kept current. `dist/` is committed and is what a consumer
  # copies, so it can be a source edit behind without anything saying so —
  # and Storybook serves it, which makes stale output something you look at.
  # Its own service rather than a step in the Storybook container: it belongs
  # to no surface in particular, and `make start` can then report it.
  dist:
    <<: *app
    command: ['node', 'scripts/dist.ts', '--watch']
