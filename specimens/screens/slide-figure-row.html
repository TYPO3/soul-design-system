<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Figure, row</title>
<link rel="stylesheet" href="../../packages/frontend/src/styles/styles.css" />
</head>
<body class="sds-app">
<div class="sds-slide sds-slide--figure sds-slide--row sds-slide--framed" data-theme="light">
  <div class="sds-slide__head">
    <div class="sds-eyebrow">03 · How to build a slide</div>
    <h2 class="sds-h2">Three pages at hand</h2>
    
    
  </div>
  <div class="sds-slide__figure"><div class="sds-slide__drawing">
    <p class="sds-label">Search</p>
    <div class="sds-slide__art"><div class="sds-slide__fit"><img class="sds-art" src="../../packages/frontend/assets/screenshots/search-phone.png" alt="The search page on a phone. The results for label, the filters by kind, and the first hit."></div></div>
    <p class="sds-slide__caption">The filters count the hits, and the first one names where it comes from.</p>
  </div><div class="sds-slide__drawing">
    <p class="sds-label">Glyph</p>
    <div class="sds-slide__art"><div class="sds-slide__fit"><img class="sds-art" src="../../packages/frontend/assets/screenshots/glyph-phone.png" alt="The page of the glyph actions-document-edit on a phone. Its name, what it means, and the versions it is in."></div></div>
    <p class="sds-slide__caption">The name at the top, and the versions that carry it under the sentence.</p>
  </div><div class="sds-slide__drawing">
    <p class="sds-label">Checkout</p>
    <div class="sds-slide__art"><div class="sds-slide__fit"><img class="sds-art" src="../../packages/frontend/assets/screenshots/checkout-phone.png" alt="The page of the checkout 14.3-dev on a phone. The actions, and a warning that the build is two commits behind."></div></div>
    <p class="sds-slide__caption">The one thing to do next is the only orange button.</p>
  </div></div>
  
  <div class="sds-slide__foot">
    <span class="sds-lockup"><img class="sds-signet" src="../../packages/frontend/assets/design-system-signet-m.svg" alt="" width="24" height="24"><span class="sds-wordmark"><span class="sds-wordmark__brand">TYPO3</span><span class="sds-wordmark__pipe" aria-hidden="true"></span><span class="sds-wordmark__product">Dev Companion</span></span></span>
    <p class="sds-slide__count">10</p>
  </div>
</div>
</body>
</html>
