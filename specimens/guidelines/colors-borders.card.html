<!-- @dsCard group="Colors" viewport="700x240" subtitle="Hairlines do the structural work — this system has no shadows" name="Borders" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../src/styles/styles.css" />
<link rel="stylesheet" href="../src/styles/_specimen.css" />
</head>
<body>
  <div style="display:grid; grid-template-rows:1fr 1fr;">
    <div class="spec-pane" data-theme="light">
      <div class="spec-sw"><div class="spec-chip" style="border:1px solid var(--border-subtle);"></div><div class="spec-n">--border-subtle</div><div class="spec-hex">#E3DFD6</div></div>
      <div class="spec-sw"><div class="spec-chip" style="border:1px solid var(--border-strong);"></div><div class="spec-n">--border-strong</div><div class="spec-hex">#C9C3B7</div></div>
      <div class="spec-sw"><div class="spec-chip" style="border:1px solid var(--border-accent-quiet);"></div><div class="spec-n">--border-accent-quiet</div><div class="spec-hex">#F0C089</div></div>
    </div>
    <div class="spec-pane" data-theme="dark">
      <div class="spec-sw"><div class="spec-chip" style="border:1px solid var(--border-subtle);"></div><div class="spec-n">--border-subtle</div><div class="spec-hex">#2B2823</div></div>
      <div class="spec-sw"><div class="spec-chip" style="border:1px solid var(--border-strong);"></div><div class="spec-n">--border-strong</div><div class="spec-hex">#37332C</div></div>
      <div class="spec-sw"><div class="spec-chip" style="border:1px solid var(--border-accent-quiet);"></div><div class="spec-n">--border-accent-quiet</div><div class="spec-hex">#4A4437</div></div>
    </div>
  </div>
</body>
</html>
