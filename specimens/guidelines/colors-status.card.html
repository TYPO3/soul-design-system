<!-- @dsCard group="Colors" viewport="700x230" subtitle="Only ever inside code blocks, badges and result rows" name="Status & syntax" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../packages/frontend/src/styles/styles.css" />
<link rel="stylesheet" href="../../packages/frontend/src/styles/_specimen.css" />
</head>
<body>
  <div style="display:grid; grid-template-rows:1fr 1fr;">
    <div class="spec-pane" data-theme="light">
      <div class="spec-sw"><div class="spec-chip spec-chip--sm" style="background:var(--status-ok);"></div><div class="spec-n">--status-ok</div><div class="spec-hex">#4F7A3A</div></div>
      <div class="spec-sw"><div class="spec-chip spec-chip--sm" style="background:var(--status-warn);"></div><div class="spec-n">--status-warn</div><div class="spec-hex">#986200</div></div>
      <div class="spec-sw"><div class="spec-chip spec-chip--sm" style="background:var(--status-error);"></div><div class="spec-n">--status-error</div><div class="spec-hex">#A33328</div></div>
      <div class="spec-sw"><div class="spec-chip spec-chip--sm" style="background:var(--syntax-string);"></div><div class="spec-n">--syntax-string</div><div class="spec-hex">#3F6B2B</div></div>
    </div>
    <div class="spec-pane" data-theme="dark">
      <div class="spec-sw"><div class="spec-chip spec-chip--sm" style="background:var(--status-ok);"></div><div class="spec-n">--status-ok</div><div class="spec-hex">#7FA96B</div></div>
      <div class="spec-sw"><div class="spec-chip spec-chip--sm" style="background:var(--status-warn);"></div><div class="spec-n">--status-warn</div><div class="spec-hex">#D9A441</div></div>
      <div class="spec-sw"><div class="spec-chip spec-chip--sm" style="background:var(--status-error);"></div><div class="spec-n">--status-error</div><div class="spec-hex">#D4685C</div></div>
      <div class="spec-sw"><div class="spec-chip spec-chip--sm" style="background:var(--syntax-string);"></div><div class="spec-n">--syntax-string</div><div class="spec-hex">#9CC27F</div></div>
    </div>
  </div>
</body>
</html>
