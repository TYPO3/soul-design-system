<!-- @dsCard group="Colors" viewport="700x150" subtitle="The terminal canvas and the planes that sit on it" name="Surfaces — dark" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-canvas); color: var(--text-primary); }
  .card { padding: 20px 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-canvas); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-canvas</div>
        <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted);">#131210</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-raised); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-raised</div>
        <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted);">#171614</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-sunken); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-sunken</div>
        <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted);">#0C0B0A</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-inset); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-inset</div>
        <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted);">#221F1B</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-accent-quiet); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-accent-quiet</div>
        <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted);">#1C1A16</div>
      </div>
    </div>
  </div>
</body>
</html>
