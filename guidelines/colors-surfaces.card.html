<!-- @dsCard group="Colors" viewport="700x260" subtitle="Warm paper and the terminal — the same five planes in both modes" name="Surfaces" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../_specimen.css" />
</head>
<body>
  <div style="display:grid; grid-template-rows:1fr 1fr;">
    <div class="spec-pane" data-theme="light">
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-canvas); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-canvas</div><div class="spec-hex">#FBFAF7</div></div>
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-raised); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-raised</div><div class="spec-hex">#FFFFFF</div></div>
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-sunken); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-sunken</div><div class="spec-hex">#F4F2EE</div></div>
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-inset); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-inset</div><div class="spec-hex">#EFEBE3</div></div>
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-accent-quiet); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-accent-quiet</div><div class="spec-hex">#FFF6EC</div></div>
    </div>
    <div class="spec-pane" data-theme="dark">
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-canvas); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-canvas</div><div class="spec-hex">#131210</div></div>
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-raised); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-raised</div><div class="spec-hex">#171614</div></div>
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-sunken); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-sunken</div><div class="spec-hex">#0C0B0A</div></div>
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-inset); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-inset</div><div class="spec-hex">#221F1B</div></div>
      <div class="spec-sw"><div class="spec-chip" style="background:var(--surface-accent-quiet); border:1px solid var(--border-subtle);"></div><div class="spec-n">--surface-accent-quiet</div><div class="spec-hex">#1C1A16</div></div>
    </div>
  </div>
</body>
</html>
