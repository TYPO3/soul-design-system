<!-- @dsCard group="Spacing" viewport="700x170" subtitle="A 4px base, thinning out as it grows" name="Space scale" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-canvas); color: var(--text-primary); }
  .card { padding: 20px 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="card" style="display:flex; align-items:flex-end; gap:14px;">
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:4px; height:4px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">4</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:8px; height:8px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">8</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:12px; height:12px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">12</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:16px; height:16px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">16</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:20px; height:20px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">20</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:24px; height:24px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">24</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:32px; height:32px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">32</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:40px; height:40px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">40</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:48px; height:48px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">48</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
      <div style="width:64px; height:64px; background:var(--accent);"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-muted);">64</div>
    </div>
  </div>
</body>
</html>
