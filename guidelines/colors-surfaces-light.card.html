<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm paper, never pure white as the canvas" name="Surfaces — light" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../_specimen.css" />
</head>
<body>
  <div class="spec-pad">
    <div class="spec-row">
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-canvas); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-canvas</div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted);">#FBFAF7</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-raised); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-raised</div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted);">#FFFFFF</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-sunken); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-sunken</div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted);">#F4F2EE</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-inset); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-inset</div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted);">#EFEBE3</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:7px; min-width:104px;">
        <div style="height:46px; background:var(--surface-accent-quiet); border:1px solid var(--border-subtle);"></div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-primary);">--surface-accent-quiet</div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted);">#FFF6EC</div>
      </div>
    </div>
  </div>
</body>
</html>
