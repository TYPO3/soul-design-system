<!-- @dsCard group="Type" viewport="700x230" subtitle="Every step in the system, largest to smallest" name="Type scale" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-canvas); color: var(--text-primary); }
  .card { padding: 20px 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .tok { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.02em; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card" style="display:grid; grid-template-columns:repeat(2,1fr); gap:4px 28px;">
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-size:58px; letter-spacing:-0.03em; line-height:1;">Aa</span><span class="tok">--font-size-display · 58</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-size:44px; letter-spacing:-0.02em; line-height:1;">Aa</span><span class="tok">--font-size-h1 · 44</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-size:34px; letter-spacing:-0.015em;">Aa</span><span class="tok">--font-size-h2 · 34</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-size:20px;">Aa</span><span class="tok">--font-size-h3 · 20</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-size:19px;">Aa</span><span class="tok">--font-size-lead · 19</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-size:17px;">Aa</span><span class="tok">--font-size-body · 17</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-size:15px;">Aa</span><span class="tok">--font-size-ui · 15</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-family:var(--font-mono); font-size:13.5px;">Aa</span><span class="tok">--font-size-code · 13.5</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-family:var(--font-mono); font-size:12px;">Aa</span><span class="tok">--font-size-micro · 12</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px;"><span style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.09em;">AA</span><span class="tok">--font-size-label · 11</span></div>
  </div>
</body>
</html>
