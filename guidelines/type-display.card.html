<!-- @dsCard group="Type" viewport="700x180" subtitle="Source Sans 3, 600, tight tracking — one per page" name="Display & headings" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-canvas); color: var(--text-primary); }
  .card { padding: 20px 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .tok { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.02em; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:var(--font-size-display); line-height:var(--leading-display); letter-spacing:var(--tracking-display); font-weight:var(--weight-semibold);">It answers before</div>
    <div style="font-size:var(--font-size-h2); line-height:var(--leading-heading); letter-spacing:var(--tracking-heading); font-weight:var(--weight-semibold); margin-top:6px;">Three audiences, one server</div>
    <div class="tok" style="margin-top:12px;">--font-size-display / --font-size-h2 · 58 / 34 px · 600 · -0.03em / -0.015em</div>
  </div>
</body>
</html>
