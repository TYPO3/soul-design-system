<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-canvas); color: var(--text-primary); }
  .card { padding: 20px 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="card" style="display:flex; flex-direction:column; gap:12px;">
    <div style="font-family:var(--font-mono); font-size:26px; font-weight:500; letter-spacing:-0.01em;">typo3_icon_lookup</div>
    <div class="lbl">TOOL SURFACE · 11 px · 0.09em · uppercase</div>
    <pre style="margin:0; font-family:var(--font-mono); font-size:var(--font-size-code); line-height:var(--leading-code); color:var(--text-secondary); background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-card); padding:12px 14px;"><span style="color:var(--syntax-comment);"># clone, install once</span>
<span style="color:var(--accent);">$</span> composer install</pre>
  </div>
</body>
</html>
