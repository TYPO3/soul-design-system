<!-- @dsCard group="Spacing" viewport="700x180" subtitle="210px tool rail, 1080px content, 48px page gutter" name="Layout frame" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../src/styles/styles.css" />
<link rel="stylesheet" href="../src/styles/_specimen.css" />
</head>
<body>
  <div style="padding:16px 20px;">
    <div style="border:1px solid var(--border-subtle); display:grid; grid-template-columns:var(--width-sidebar) 1fr; height:120px;">
      <div style="border-right:1px solid var(--border-subtle); background:var(--surface-raised); padding:12px; display:flex; flex-direction:column; gap:7px;">
        <span class="spec-lbl">TOOL SURFACE</span>
        <span style="font-family:var(--font-mono); font-size:12px; background:var(--accent); color:var(--text-on-accent); padding:3px 7px; align-self:flex-start;">typo3_rule_lookup</span>
        <span style="font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); padding:3px 7px;">typo3_hint_lookup</span>
      </div>
      <div style="padding:14px 18px;">
        <div style="font-family:var(--font-mono); font-size:18px; color:var(--text-primary);">typo3_rule_lookup</div>
        <div style="height:1px; background:var(--border-subtle); margin:12px 0;"></div>
        <div class="spec-cap" style="font-size:11px;">--width-sidebar 210 · --gutter-page 48 · --width-content 1080</div>
      </div>
    </div>
  </div>
</body>
</html>
