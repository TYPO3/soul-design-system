<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-canvas); color: var(--text-primary); }
  .card { padding: 20px 22px; }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .tok { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.02em; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card" style="display:flex; flex-direction:column; gap:9px;">
    <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-size:19px; color:var(--text-primary);">Answers with their source attached</span><span class="tok">--text-primary · #EDE9E2</span></div>
    <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-size:17px; color:var(--text-secondary);">Version-bound knowledge that needs nothing running</span><span class="tok">--text-secondary · #A9A299</span></div>
    <div style="display:flex; align-items:baseline; gap:14px;"><span style="font-size:15px; color:var(--text-muted);">stdio · php 8.2+</span><span class="tok">--text-muted · #6E6860</span></div>
    <div style="display:flex; align-items:baseline; gap:14px;"><a href="#" style="font-size:15px; color:var(--text-link);">typo3_server_scope</a><span class="tok">--text-link · #FFA338</span></div>
  </div>
</body>
</html>
