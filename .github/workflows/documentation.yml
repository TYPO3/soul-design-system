# The site, rendered and published.
#
# Called from `ci.yml` on `main`, behind the gate and behind the mirror — and
# behind it for two reasons now. This site is the manual that tells a reader to
# install those packages, and it is *built* by installing them: the theme the
# job before this one pushed is what renders these pages.
#
# No container, therefore. A PHP, a Node and Composer are what a reader has, and
# they are all this needs.
name: Documentation

on:
  workflow_call:
  # By hand as well: putting the site back after a bad deploy should not need
  # a commit invented for it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: render the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Ours, and a reader's project has neither: the specimen cards these pages
      # embed, out of the committed `specimens/` and into the documents beside
      # them. Both tasks generate nothing, which is why they run here at all —
      # writing a card needs Lit, copying one needs a Node.
      - run: node scripts/embed.ts

      # A reader's, verbatim — `docs/guides-theme/_starter/publish.yml` prints
      # these three and this job runs them. The theme is the one the mirror
      # pushed a job ago, and it brings the renderer, the templates and the
      # drop-in with it.
      - name: The renderer
        env:
          RENDERER: ${{ runner.temp }}/renderer
        run: |
          mkdir -p "$RENDERER"
          cd "$RENDERER"
          composer init --no-interaction --name=typo3/soul-documentation
          composer config repositories.soul vcs https://github.com/TYPO3/soul-guides-theme
          composer require --no-interaction --no-progress typo3/soul-guides-theme:dev-main

      # `docs` and not the theme's control surface: this job renders what it
      # uploads.
      - name: Render the documents
        run: ${{ runner.temp }}/renderer/vendor/bin/guides docs --output=.out/site -c docs --fail-on-error

      # Ours again, between the render and the step that finishes it: the chrome
      # the embedded cards are drawn with, which is deliberately not in the
      # drop-in and so arrives from nowhere else.
      - run: node scripts/chrome.ts .out/site

      - name: Finish the site
        run: node ${{ runner.temp }}/renderer/vendor/typo3/soul-guides-theme/resources/dist/soul-finish.js .out/site

      # Pages serves this artifact as it stands, but a repository ever switched
      # back to the branch-based build runs Jekyll over it, and Jekyll drops
      # every path beginning with an underscore — `_cards/`, `_images/`,
      # `_search.json`, most of what the pages point at.
      - run: touch .out/site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .out/site

  publish:
    name: publish
    needs: render
    runs-on: ubuntu-latest
    # Writing a deployment is the one thing here that leaves a mark outside the
    # run, so the permissions sit on the job that does it.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Deployments queue rather than cancel: a half-replaced site is worse than
    # a site one commit behind.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5

      - id: deploy
        uses: actions/deploy-pages@v4
