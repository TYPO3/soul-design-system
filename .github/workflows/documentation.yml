# The site, rendered and published.
#
# `ci.yml` calls this on `main`, behind the gate and behind the mirror. This
# site is the manual that tells a reader to install those packages, so it
# goes out once they are there. Its build installs the theme the way a
# reader does, but from this commit: the site is the render of this tree.
#
# No container, therefore. A PHP, a Node and Composer are what a reader has, and
# they are all this needs.
name: Documentation

on:
  workflow_call:
  # By hand as well: to put the site back after a bad deploy must not need
  # a commit invented for it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: render the site
    runs-on: ubuntu-latest
    # To read where Pages serves the site, and nothing more.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Ours, and a reader's project has neither: the specimen cards these pages
      # embed, out of the committed `specimens/` and into the documents beside
      # them. Both tasks generate nothing, which is why they run here at all —
      # writing a card needs Lit, copying one needs a Node.
      - run: node scripts/embed.ts

      # The theme as this commit has it, assembled the way the mirror gets it.
      # This job is the render of this tree. A theme from the mirror or from
      # Packagist is a theme from another commit, as soon as either lags.
      - name: The theme
        run: node scripts/split.ts guides-theme --into=${{ runner.temp }}/theme

      # A reader's — `docs/guides-theme/_starter/publish.yml` prints these
      # three, and this job runs them with the theme above as the source. It
      # brings the renderer, the templates and the drop-in with it.
      - name: The renderer
        env:
          RENDERER: ${{ runner.temp }}/renderer
          THEME: ${{ runner.temp }}/theme
        run: |
          mkdir -p "$RENDERER"
          cd "$RENDERER"
          composer init --no-interaction --name=typo3/soul-documentation
          composer config repositories.soul path "$THEME"
          # A path repository takes its version from the directory, which is
          # no checkout. `*@dev` takes what is there.
          composer require --no-interaction --no-progress 'typo3/soul-guides-theme:*@dev'

      # `docs` and not the theme's control surface: this job renders what it
      # uploads.
      - name: Render the documents
        run: ${{ runner.temp }}/renderer/vendor/bin/guides docs --output=.out/site -c docs --fail-on-error

      # Ours again, between the render and the step that finishes it: the chrome
      # the embedded cards draw with, which is deliberately not in the drop-in
      # and so arrives from nowhere else.
      - run: node scripts/chrome.ts .out/site

      # Where the target serves the site. A link to a page on another site
      # needs the whole address, and only the target knows it.
      - id: pages
        uses: actions/configure-pages@v6

      # The list of moved addresses is this site's own: a reader's project has none.
      - name: Finish the site
        run: node ${{ runner.temp }}/renderer/vendor/typo3/soul-guides-theme/resources/dist/soul-finish.js .out/site --redirects=docs/redirects.json --url=${{ steps.pages.outputs.base_url }}

      # Storybook, below the documentation at `storybook/`: a repository has
      # one Pages site, and this is it. Not built here — the gate built it in
      # the container, `make test` opened it, and this job publishes that
      # build rather than a second one from an `npm ci` a reader never runs.
      # A site put back by hand has no gate in front of it and so no
      # artifact; it goes out without Storybook, and the next push to `main`
      # brings it back.
      - if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          name: storybook
          path: .out/site/storybook

      # Pages serves this artifact as it stands, but a repository ever switched
      # back to the branch-based build runs Jekyll over it, and Jekyll drops
      # every path beginning with an underscore — `_cards/`, `_images/`,
      # `_search.json`, most of what the pages point at.
      - run: touch .out/site/.nojekyll

      # The upload leaves a dotfile out unless told otherwise, and the marker
      # above is one.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .out/site
          include-hidden-files: true

  publish:
    name: publish
    needs: render
    runs-on: ubuntu-latest
    # Writing a deployment is the one thing here that leaves a mark outside the
    # run, so the permissions sit on the job that does it.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Deployments queue rather than cancel: a half-replaced site is worse than
    # a site one commit behind.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6

      - id: deploy
        uses: actions/deploy-pages@v5
