# A package under `packages/`, pushed to the repository it is published from.
#
# Packagist reads the `composer.json` at a repository root and npm installs
# from one, so a package in a subdirectory does not exist for either. The
# mirror is `scripts/split.ts`: it replays every commit that touched the
# package, with the message, author and date it had here. This file is the
# push and nothing else — what goes into a package is decided in the task, so
# `make split` on a desk and this workflow cannot produce different packages.
#
# Started by hand, because publishing is a decision. Tags come from this
# repository's own tags rather than from an input: a release is a tag here
# first, and the mirror carries it over.
name: Split a package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package under packages/ to publish
        type: choice
        options: [guides-theme, frontend]
        required: true
      repository:
        description: The repository to push to, as owner/name
        required: true
      branch:
        description: The branch the package is mirrored on
        default: main
        required: true

permissions:
  contents: read

jobs:
  split:
    name: assemble and push
    runs-on: ubuntu-latest
    steps:
      # The whole history and every tag: the mirror replays commits, and a
      # shallow checkout has none of them to replay.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # No container and no install: the task reads the tree and copies files,
      # and Node runs it by stripping the types.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The committed drop-in is what the theme package carries, so a stale one
      # would be published as though it were the source. The gate proves this on
      # every push; it is asked again here because a release is the one moment
      # nobody gets to check afterwards.
      - name: The drop-in matches its source
        run: node scripts/dist.ts --check

      # Clone the mirror first, so the replay continues that history instead of
      # starting a new one — the task reads where it stopped from the trailer on
      # the last commit over there.
      - name: Assemble the package
        env:
          TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SPLIT_TOKEN is not set — create a token with write access to ${{ inputs.repository }}"
            exit 1
          fi
          node scripts/split.ts ${{ inputs.package }} \
            --branch=${{ inputs.branch }} \
            --remote="https://x-access-token:${TOKEN}@github.com/${{ inputs.repository }}.git"

      - name: Push it
        env:
          TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          cd .split/${{ inputs.package }}
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ inputs.repository }}.git" 2>/dev/null || true
          # The branch is replayed history, so a normal push is what it takes;
          # a mirror that needs forcing is one somebody committed into by hand.
          git push origin "${{ inputs.branch }}"
          # Tags never move: a release that changes is a release nobody can
          # rely on, and `--tags` refuses rather than overwriting.
          git push --tags origin

      - name: What was published
        run: |
          cd .split/${{ inputs.package }}
          {
            echo "### ${{ inputs.repository }}"
            echo
            echo "Branch \`${{ inputs.branch }}\` now at \`$(git rev-parse --short HEAD)\` — $(git rev-list --count HEAD) commit(s)."
            echo
            git tag --points-at HEAD | sed 's/^/Tagged /'
          } >> "$GITHUB_STEP_SUMMARY"
