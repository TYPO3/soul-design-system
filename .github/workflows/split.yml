# A package under `packages/`, pushed to the repository it is published from.
#
# Packagist reads the `composer.json` at a repository root and npm installs
# from one, so a package in a subdirectory does not exist for either. The
# mirror is `scripts/split.ts`: it replays every commit that touched the
# package, with the message, author and date it had here. This file is the
# push and nothing else — what goes into a package is decided in the task, so
# `make split` on a desk and this workflow cannot produce different packages.
#
# Called by `ci.yml` on every push to `main`, once the gate is green over that
# tree: a mirror somebody has to remember to start is a mirror that is behind,
# and a consumer installing from it gets a release nobody made. Startable by
# hand as well, for a rerun or for one package on its own — over a tree the
# gate has passed, because nothing below checks one again.
#
# Where each package is published is declared in the task too, and asked for
# here rather than written down a second time. Tags come from this
# repository's own tags: a release is a tag here first, and the mirror carries
# it over.
name: Split a package

on:
  workflow_call:
    inputs:
      package:
        description: One package under packages/, or all of them
        type: string
        default: all
      branch:
        description: The branch the package is mirrored on
        type: string
        default: main
  workflow_dispatch:
    inputs:
      package:
        description: Which package under packages/ to publish
        type: choice
        options: [all, guides-theme, frontend]
        default: all
      branch:
        description: The branch the package is mirrored on
        default: main
        required: true

permissions:
  contents: read

# One mirror run at a time. Two replaying the same history race each other,
# and the loser is a non-fast-forward nobody asked for. Queued rather than
# cancelled: a cancelled run leaves the mirror behind instead of merely late.
concurrency:
  group: split
  cancel-in-progress: false

jobs:
  split:
    name: assemble and push
    runs-on: ubuntu-latest
    steps:
      # The whole history and every tag: the mirror replays commits, and a
      # shallow checkout has none of them to replay.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # No container and no install: the task reads the tree and copies files,
      # and Node runs it by stripping the types. Rebuilding the committed
      # drop-in to compare it against its source would need both — it is the
      # gate's `dist` check, over this same commit, before this job may start.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The task clones each mirror before it replays into it, so it is handed
      # the address it declares with a token in front — a runner has no key for
      # an SSH remote, and a clone that fails silently starts the history over.
      - name: Assemble and push
        env:
          TOKEN: ${{ secrets.SPLIT_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SPLIT_TOKEN is not set — create a token with write access to the mirrors"
            exit 1
          fi
          while read -r name remote; do
            [ "$PACKAGE" = all ] || [ "$PACKAGE" = "$name" ] || continue
            url="https://x-access-token:${TOKEN}@github.com/${remote#git@github.com:}"
            node scripts/split.ts "$name" --branch="$BRANCH" --remote="$url"
            cd ".out/split/$name"
            # The branch is replayed history, so a normal push is what it takes;
            # a mirror that needs forcing is one somebody committed into by hand.
            git push "$url" "$BRANCH"
            # Tags never move: a release that changes is a release nobody can
            # rely on, and `--tags` refuses rather than overwriting.
            git push --tags "$url"
            {
              echo "### ${remote#git@github.com:}"
              echo
              echo "Branch \`$BRANCH\` now at \`$(git rev-parse --short HEAD)\` — $(git rev-list --count HEAD) commit(s)."
              echo
              git tag --points-at HEAD | sed 's/^/Tagged /'
            } >> "$GITHUB_STEP_SUMMARY"
            cd - >/dev/null
          done <<< "$(node scripts/split.ts --remotes)"
