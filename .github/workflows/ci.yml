# The gate, run by a machine.
#
# Until this file existed, `make verify` was something a person typed before
# committing — which means it held exactly as long as everyone remembered.
# The same tasks run here, in the same image, through the same Makefile: a
# workflow that reimplemented the steps would be a second definition of the
# gate, and the two would drift apart on the first change to either.
#
# Only the gate has an image, and it runs on every push and every pull request.
# What follows runs behind it and in one order: the packages are mirrored into
# the repositories they are released from, then the site that tells a reader to
# install them is rendered and deployed. A tag takes the same road as far as
# the mirror and turns off at the release — which is the whole of what a
# release is here, a tag pushed at a tree this gate has passed.
name: CI

# Every push, whatever the branch — a branch nobody has opened a pull request
# for is exactly where work sits while it is being written. Pull requests are
# listened for as well, but the job below skips the ones that come from this
# repository: their commits already arrived as a push, and running both gates
# the same tree twice.
on:
  push:
  pull_request:

# Nothing here writes to the repository. The publish job asks for more, next
# to itself, so this line stays true for everything else.
permissions:
  contents: read

# A second push to the same branch replaces the first. Pages deployments are
# serialised separately, in the job that does them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: verify and test
    runs-on: ubuntu-latest
    # A pull request from a fork has no push event of its own here; one from a
    # branch of this repository does.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image is only the toolchain. Source arrives through Compose's /app
      # mount, so a normal commit changes no image layer. Buildx restores the
      # finished layers from one named Actions cache and loads them into the
      # fresh runner; only a manifest or Dockerfile change builds new ones.
      #
      # No registry, on purpose. A pushed image is a second thing that can be
      # stale against the Dockerfile that describes it, and it has to be
      # published, tagged and cleaned up by someone.
      #
      # The tag is the name compose derives from the project and the service —
      # `<project>-<service>`, and the project is named in the compose file.
      # Miss it and `up` finds no image and builds its own, uncached.
      - name: Load the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .infra/Dockerfile
          target: app
          tags: typo3-soul-design-system-app:latest
          load: true
          cache-from: |
            type=gha,scope=toolchain
            type=gha
          cache-to: type=gha,scope=toolchain,mode=min

      # The one compose call that is not behind a make target, because it is
      # the thing make assumes: `.infra/task.sh` execs into a running `app`
      # and only builds a container of its own when there is none. With the
      # service up, every task below is an exec into the image built above.
      # The UID matters for the same reason it does on a developer's machine —
      # the tree is bind-mounted, and output written as root cannot be read
      # back by the steps that follow.
      - name: Bring up the container the tasks run in
        run: |
          # A fresh checkout has no `.out/`, and Docker creates a missing
          # bind-mount path as root — which leaves the whole directory
          # unwritable for the UID below. `make` does this too; this is the
          # one compose call that does not go through it.
          mkdir -p .out/storybook
          SDS_UID=$(id -u) SDS_GID=$(id -g) docker compose -f .infra/docker-compose.yml up -d app

      # The line that decides whether the tree is consistent; everything else
      # in this file exists to make it run.
      - run: make verify

      # The suites, each holding something verify cannot see: that the markup
      # renders, in both themes, at every width, without axe findings.
      - run: make test

      # Only on failure, and only then worth the upload: traces and the
      # screenshots of what the browser actually had on screen.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .out/playwright-report/
            .out/test-results/
          retention-days: 7

  # The packages, into the repositories they are installed from. Every push to
  # `main`, and every release tag: a mirror that waits for somebody to start it
  # is one a consumer installs behind this tree, and a pull request is not a
  # tree anybody may install. The tag matters on its own because Packagist
  # reads the theme's version off the mirror's tags and nothing else — and
  # because branch and tag arrive as two events, either of which may be first.
  # `needs: gate` for the same reason the site has it.
  mirror:
    name: mirror the packages
    needs: gate
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/split.yml
    with:
      package: all
      branch: main
    secrets: inherit

  # The release: the npm package from this tree, and a GitHub release on the
  # tag. Behind the mirror, because Packagist takes the theme's version off a
  # tag that has to be over there first. Not a called workflow, unlike the two
  # jobs either side of it: npm's trusted publishing trusts one workflow file
  # by name, and a job in a called file is a second name to get right.
  release:
    name: publish the release
    needs: [gate, mirror]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release, and the OIDC token npm exchanges for the publish.
      # No npm credential exists in this repository, which is the point.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # `registry-url` is what points the publish at npm's own registry. No
      # cache in a release build — npm's instruction, and a restored one is a
      # tree nobody checked. Node 24 carries an npm that can do OIDC at all;
      # anything older fails at the publish rather than quietly.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # The tag is what a consumer asks for, and npm reads the number out of a
      # manifest instead. This is the one place both are in the room together.
      - run: node scripts/release.ts --check --tag=${{ github.ref_name }}

      # `assets/icons/` is generated and gitignored, and the manifest publishes
      # `assets/` — without this the package installs with every icon a blank
      # box. `--ignore-scripts` for the reason the image installs that way.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/icons.ts

      # No `--provenance` and no token: trusted publishing attests the build
      # from the OIDC token above, and that is npm's own instruction. `dist/`
      # is committed and the gate compared it, so nothing is built here.
      - run: npm publish
        working-directory: packages/frontend

      - name: the release those packages were cut from
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  # The site, rendered and deployed by `documentation.yml` — the shape the
  # example hands a reader, on our own documentation. Behind the mirror rather
  # than beside it: these pages name those packages. The deployment is the one
  # thing in this file that leaves a mark outside the run, and a called
  # workflow gets no more than the job calling it, so the permissions sit here.
  documentation:
    name: the site
    needs: [gate, mirror]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/documentation.yml
