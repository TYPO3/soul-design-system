<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -20 140 140" role="img" aria-label="TYPO3 Support App">
  <title>TYPO3 Support App</title>
  <style>
    /* An image cannot inherit currentColor, so the ink is a mid warm grey
       that holds on both modes, lifted a step in dark. The accent is flat
       #FF8700 in both, exactly as --accent is. */
    .ink  { stroke: #8A8378; }
    .inkf { fill: #8A8378; }
    @media (prefers-color-scheme: dark) {
      .ink  { stroke: #A9A299; }
      .inkf { fill: #A9A299; }
    }
  </style>
  <!-- S - 16-19px, favicon. Stroke 11, marker 40x58, square box. -->
  <path class="ink" d="M128 80.00V80A20 20 0 0 1 108 100H20A20 20 0 0 1 0 80V20A20 20 0 0 1 20 0H66.00" fill="none" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"></path>
  <rect class="inkf" x="22" y="28.5" width="52" height="11" rx="5.5"></rect>
  <rect x="22" y="60.5" width="66" height="11" rx="5.5" fill="#FF8700"></rect>
  <path d="M88.00 0H108.00A20 20 0 0 1 128 20V58.00Z" fill="#FF8700" stroke="#FF8700" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
