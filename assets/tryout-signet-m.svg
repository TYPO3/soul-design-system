<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 140 112" role="img" aria-label="TYPO3 Tryout">
  <title>TYPO3 Tryout</title>
  <style>
    /* An image cannot inherit currentColor, so the ink is a mid warm grey
       that holds on both modes, lifted a step in dark. The accent is flat
       #FF8700 in both, exactly as --accent is. */
    .ink  { stroke: #8A8378; }
    .inkf { fill: #8A8378; }
    @media (prefers-color-scheme: dark) {
      .ink  { stroke: #A9A299; }
      .inkf { fill: #A9A299; }
    }
  </style>
  <!-- M - 20-31px. Stroke 8.5, marker 36x54. The sibling mark drops its
       faint middle line here; this one has nothing to drop, so the triangle
       is redrawn a little smaller instead - the heavier stroke inflates it
       by 4.25 a side, and the inked size has to stay put. -->
  <path class="ink" d="M128 71.00V80A20 20 0 0 1 108 100H20A20 20 0 0 1 0 80V20A20 20 0 0 1 20 0H75.00" fill="none" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"></path>
  <path d="M38.75 30.25L38.75 69.75L76 50Z" fill="#FF8700" stroke="#FF8700" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"></path>
  <path d="M92.00 0H108.00A20 20 0 0 1 128 20V54.00Z" fill="#FF8700" stroke="#FF8700" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
