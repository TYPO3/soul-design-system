<svg xmlns="http://www.w3.org/2000/svg" id="art" viewBox="0 -14 128 128" role="img" aria-label="TYPO3 Tryout">
  <title>TYPO3 Tryout</title>
  <!-- Every colour sits on its own shape, as a var() with a hex fallback: a
       page that declares the tokens gets its own ink, and this file still
       renders on its own. Nothing colours it from a <style> or from the root,
       and no comment in here may carry a double dash, which is what makes an
       SVG malformed and a reference to it draw nothing. See
       docs/guidelines/artwork.rst. -->
  <!-- S - 16-19px, favicon. Stroke 11, marker 40x58, square box - the same
       square viewBox the sibling uses, because a favicon is a square slot
       and the browser will letterbox anything else. -->
  <path stroke="var(--text-primary, #8A8378)" d="M122.5 80.00V80A14.5 14.5 0 0 1 108 94.5H20A14.5 14.5 0 0 1 5.5 80V20A14.5 14.5 0 0 1 20 5.5H66.00" fill="none" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"></path>
  <path d="M40 31.5L40 68.5L75 50Z" fill="var(--accent, #FF8700)" stroke="var(--accent, #FF8700)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"></path>
  <path d="M88.00 5.5H108A14.5 14.5 0 0 1 122.5 20V58.00Z" fill="var(--accent, #FF8700)" stroke="var(--accent, #FF8700)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
