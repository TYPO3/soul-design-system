<!-- @dsCard group="Components" viewport="700x260" subtitle="Active is a filled block, not a tint" name="Tabs & tool rail" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-canvas); color: var(--text-primary); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.02em; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn { font-family: var(--font-sans); font-size: 14px; font-weight: 600; border-radius: var(--radius-control); padding: 8px 15px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out); }
  .btn-primary { background: var(--accent); color: var(--text-on-accent); }
  .btn-secondary { background: transparent; color: var(--text-primary); border-color: var(--border-strong); }
  .btn-ghost { background: transparent; color: var(--text-secondary); }
  .btn-sm { font-size: 13px; padding: 5px 11px; }
  .badge { font-family: var(--font-mono); font-size: 11.5px; padding: 3px 8px; border-radius: var(--radius-control); border: 1px solid var(--border-strong); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
  <div style="padding:20px 22px; display:flex; gap:26px; flex-wrap:wrap;">
    <div style="display:flex; flex-direction:column; gap:14px; flex:1; min-width:300px;">
      <nav style="display:flex; gap:4px; font-family:var(--font-mono); font-size:12.5px;">
        <span style="color:var(--text-on-accent); background:var(--accent); padding:6px 12px; border-radius:var(--radius-control);">overview</span>
        <span style="color:var(--text-secondary); padding:6px 12px; border-radius:var(--radius-control);">tools</span>
        <span style="color:var(--text-secondary); padding:6px 12px; border-radius:var(--radius-control);">knowledge</span>
      </nav>
      <div style="display:flex; gap:0; border-bottom:1px solid var(--border-subtle); font-family:var(--font-mono); font-size:12px;">
        <span style="padding:9px 14px; color:var(--text-primary); border-bottom:2px solid var(--accent); margin-bottom:-1px;">standalone</span>
        <span style="padding:9px 14px; color:var(--text-muted);">as a dependency</span>
        <span style="padding:9px 14px; color:var(--text-muted);">ddev</span>
      </div>
      <div class="tok">PILL NAV FOR SECTIONS &#183; UNDERLINE TABS INSIDE A PANEL</div>
    </div>
    <div style="width:210px; display:flex; flex-direction:column; gap:9px;">
      <span class="tok">TOOL SURFACE</span>
      <div style="display:flex; flex-direction:column; gap:1px; font-family:var(--font-mono); font-size:12.5px;">
        <span style="color:var(--text-on-accent); background:var(--accent); padding:5px 9px; border-radius:var(--radius-control);">typo3_icon_lookup</span>
        <span style="color:var(--text-secondary); padding:5px 9px;">typo3_label_lookup</span>
        <span style="color:var(--text-secondary); padding:5px 9px;">typo3_schema_lookup</span>
      </div>
    </div>
  </div>
</body>
</html>
