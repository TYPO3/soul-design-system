<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="d-title d-desc">
<title id="d-title">One key for two languages</title>
<desc id="d-desc">Three panels. A German call writes the slot of a key. The array holds one slot for each key and no language. An English call for the same key reads the German answer. The path of the English call is the one accent.</desc>
<g id="soul-ref">
<rect width="1200" height="440" fill="var(--surface-canvas, #FBFAF7)"></rect>
<rect x="0.5" y="0.5" width="379" height="439" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="24" y="40" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="16" font-weight="600">A call writes</text>
<text x="24" y="62" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">resolve · key and language</text>
<line x1="24" y1="352" x2="356" y2="352" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></line>
<text x="24" y="382" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">The first call fills the slot</text>
<text x="24" y="402" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">in the language it names.</text>
<rect x="24" y="104" width="332" height="44" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="190" y="132" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="middle">resolve(&#39;answer.empty&#39;, &#39;de&#39;)</text>
<line x1="190" y1="148" x2="190" y2="212" stroke="var(--text-muted, #726C63)" stroke-width="1.5"></line>
<path d="M185 212 L195 212 L190 220 Z" fill="var(--text-muted, #726C63)"></path>
<text x="202" y="188" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">writes</text>
<rect x="24" y="224" width="332" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></rect>
<text x="40" y="252" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14">answer.empty</text>
<text x="340" y="252" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">Nothing found (de)</text>
<rect x="410.5" y="0.5" width="379" height="439" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="434" y="40" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="16" font-weight="600">The key holds no language</text>
<text x="434" y="62" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">cache[ key ]</text>
<line x1="434" y1="352" x2="766" y2="352" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></line>
<text x="434" y="382" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">One slot for each key, whatever</text>
<text x="434" y="402" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">language the next call names.</text>
<rect x="434" y="96" width="332" height="228" rx="6" fill="none" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></rect>
<text x="450" y="120" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">cache[]</text>
<rect x="450" y="136" width="300" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="466" y="164" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14">answer.empty</text>
<text x="734" y="164" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">Nothing found (de)</text>
<rect x="450" y="196" width="300" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="466" y="224" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14">answer.none</text>
<text x="734" y="224" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">—</text>
<rect x="450" y="256" width="300" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="466" y="284" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14">label.tool</text>
<text x="734" y="284" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">Tool (de)</text>
<rect x="820.5" y="0.5" width="379" height="439" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="844" y="40" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="16" font-weight="600">The next call reads it</text>
<text x="844" y="62" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">resolve · same key, &#39;en&#39;</text>
<line x1="844" y1="352" x2="1176" y2="352" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></line>
<text x="844" y="382" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">The English call answers in</text>
<text x="844" y="402" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">German. The key must name both.</text>
<rect x="844" y="104" width="332" height="44" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="1010" y="132" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="middle">resolve(&#39;answer.empty&#39;, &#39;en&#39;)</text>
<line x1="1010" y1="148" x2="1010" y2="212" stroke="var(--accent, #FF8700)" stroke-width="2"></line>
<path d="M1005 212 L1015 212 L1010 220 Z" fill="var(--accent, #FF8700)"></path>
<text x="1022" y="188" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">answers in de</text>
<rect x="844" y="224" width="332" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></rect>
<text x="860" y="252" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14">answer.empty</text>
<text x="1160" y="252" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">Nothing found (de)</text>
</g>
</svg>
