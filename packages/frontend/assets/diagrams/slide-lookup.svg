<svg xmlns="http://www.w3.org/2000/svg" width="877" height="354" viewBox="0 0 877 354" role="img" aria-labelledby="d-title d-desc">
<title id="d-title">Two calls, one slot</title>
<desc id="d-desc">A German call writes the slot of a key. An English call for the same key reads the slot and answers in German. The path of the English call is the one accent.</desc>
<g id="soul-ref">
<rect x="0" y="64" width="300" height="44" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="150.0" y="91.4" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="middle">resolve(&#39;answer.empty&#39;, &#39;de&#39;)</text>
<rect x="0" y="246" width="300" height="44" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="150.0" y="273.4" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="middle">resolve(&#39;answer.empty&#39;, &#39;en&#39;)</text>
<rect x="537" y="20" width="340" height="314" rx="6" fill="none" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></rect>
<text x="557" y="48" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">cache[]</text>
<rect x="557" y="70" width="300" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></rect>
<text x="569" y="99.04" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14">answer.empty</text>
<text x="845" y="99.04" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">Nothing found (de)</text>
<rect x="557" y="154" width="300" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></rect>
<text x="569" y="183.04" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14">answer.none</text>
<text x="845" y="183.04" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">—</text>
<rect x="557" y="238" width="300" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></rect>
<text x="569" y="267.04" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="14">label.tool</text>
<text x="845" y="267.04" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">Tool (de)</text>
<path d="M300 86 H430 V84 H549" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>
<path d="M549 79 L549 89 L557 84 Z" fill="var(--text-muted, #726C63)"></path>
<text x="318" y="76" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">writes</text>
