<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="d-title d-desc">
<title id="d-title">The second lookup of a key stops at the array</title>
<desc id="d-desc">Two rows of the same four stops: the call, the array on the service, the catalogue reader, and the file. The first lookup passes through all four and reads the file. The second lookup hits the array and goes no further; the reader and the file stand behind dashed connectors it never follows.</desc>
<g id="soul-ref">
<rect width="1200" height="620" fill="var(--surface-canvas, #FBFAF7)"></rect>
<text x="60" y="60" fill="var(--accent, #FF8700)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" font-weight="600" letter-spacing="1.6">ONE REQUEST · TWO LOOKUPS OF ONE KEY</text>
<text x="60" y="108" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">The second lookup of a key stops at the array</text>
<text x="60" y="140" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="17">What a lookup passes through before it answers, once before the change and once after it.</text>
<line x1="60" y1="176" x2="1140" y2="176" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></line>
<text x="60" y="254" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" font-weight="600">First lookup</text>
<rect x="220" y="224" width="180" height="48" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="310.0" y="254.0" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="18" font-weight="600" text-anchor="middle">resolve()</text>
<rect x="470" y="224" width="180" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="560.0" y="254.0" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="middle">cache[]</text>
<rect x="720" y="224" width="180" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="810.0" y="254.0" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="middle">CatalogueReader</text>
<rect x="970" y="224" width="170" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="1055.0" y="254.0" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="middle">locallang.xlf</text>
<path d="M400 248 H466" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>
<path d="M461 244 470 248 461 252Z" fill="var(--text-muted, #726C63)"></path>
<text x="435.0" y="239" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" text-anchor="middle">miss</text>
<path d="M650 248 H716" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>
<path d="M711 244 720 248 711 252Z" fill="var(--text-muted, #726C63)"></path>
<text x="685.0" y="239" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" text-anchor="middle">read</text>
<path d="M900 248 H966" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>
<path d="M961 244 970 248 961 252Z" fill="var(--text-muted, #726C63)"></path>
<text x="935.0" y="239" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" text-anchor="middle">3 ms</text>
<text x="60" y="404" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" font-weight="600">Second lookup</text>
<rect x="220" y="374" width="180" height="48" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="310.0" y="404.0" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="18" font-weight="600" text-anchor="middle">resolve()</text>
<rect x="470" y="374" width="180" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="560.0" y="404.0" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="middle">cache[]</text>
<rect x="720" y="374" width="180" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="810.0" y="404.0" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="middle">CatalogueReader</text>
<rect x="970" y="374" width="170" height="48" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="1055.0" y="404.0" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600" text-anchor="middle">locallang.xlf</text>
<path d="M400 398 H466" stroke="var(--accent, #FF8700)" stroke-width="2" fill="none"></path>
<path d="M461 394 470 398 461 402Z" fill="var(--accent, #FF8700)"></path>
<text x="435.0" y="389" fill="var(--accent, #FF8700)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" text-anchor="middle">hit</text>
<path d="M650 398 H716" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none" stroke-dasharray="3 3.5"></path>
<path d="M711 394 720 398 711 402Z" fill="var(--text-muted, #726C63)"></path>
<text x="685.0" y="389" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" text-anchor="middle">no read</text>
<path d="M900 398 H966" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none" stroke-dasharray="3 3.5"></path>
<path d="M961 394 970 398 961 402Z" fill="var(--text-muted, #726C63)"></path>
<text x="470" y="300" fill="var(--text-muted, #726C63)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="13">an array on the service, alive for one request</text>
<text x="60" y="470" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">Both lookups answer the same label. The second answers from the array, and the file stays closed.</text>
<line x1="60" y1="520" x2="1140" y2="520" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></line>
<text x="60" y="554" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="16" font-weight="600">Forty labels on a page are three reads, not forty.</text>
<text x="60" y="580" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">The array lives one request, so nothing answers a later request from an earlier one.</text>
</g>
</svg>
