<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="d-title d-desc">
<title id="d-title">One slot answers two languages</title>
<desc id="d-desc">Two calls for the same key, one in German and one in English, both reach the same slot of the array. The German call writes the slot; the English call reads it and answers in German. The English path is drawn in the error colour.</desc>
<g id="soul-ref">
<rect width="1200" height="560" fill="var(--surface-canvas, #FBFAF7)"></rect>
<text x="60" y="60" fill="var(--status-error, #A33328)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" font-weight="600" letter-spacing="1.6">THE KEY OF THE ARRAY · FINDING F1.2</text>
<text x="60" y="108" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">One slot answers two languages</text>
<text x="60" y="140" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="17">The array keys on the label&#39;s key alone, so the first answer for a key stays whatever language the next call names.</text>
<line x1="60" y1="176" x2="1140" y2="176" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></line>
<rect x="60" y="224" width="330" height="48" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="225.0" y="254.0" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="18" font-weight="600" text-anchor="middle">resolve(&#39;answer.empty&#39;, &#39;de&#39;)</text>
<rect x="60" y="344" width="330" height="48" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="225.0" y="374.0" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="18" font-weight="600" text-anchor="middle">resolve(&#39;answer.empty&#39;, &#39;en&#39;)</text>
<rect x="560" y="208" width="580" height="240" rx="6" fill="none" stroke="var(--border-strong, #C9C3B7)" stroke-width="1.5"></rect>
<text x="580" y="236" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">cache[]</text>
<rect x="580" y="252" width="540" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="600" y="279" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600">answer.empty</text>
<text x="1100" y="279" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">Nothing found (de)</text>
<rect x="580" y="312" width="540" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="600" y="339" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600">answer.none</text>
<text x="1100" y="339" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">—</text>
<rect x="580" y="372" width="540" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="600" y="399" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="16" font-weight="600">label.tool</text>
<text x="1100" y="399" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14" text-anchor="end">Tool (de)</text>
<path d="M390 248 H470 V274 H576" stroke="var(--text-muted, #726C63)" stroke-width="1.5" fill="none"></path>
<path d="M571 270 580 274 571 278Z" fill="var(--text-muted, #726C63)"></path>
<text x="430" y="238" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" text-anchor="middle">writes</text>
<path d="M390 368 H520 V274 H576" stroke="var(--status-error, #A33328)" stroke-width="2" fill="none"></path>
<path d="M571 270 580 274 571 278Z" fill="var(--status-error, #A33328)"></path>
<text x="455" y="358" fill="var(--status-error, #A33328)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" text-anchor="middle">answers in de</text>
<line x1="60" y1="460" x2="1140" y2="460" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></line>
<text x="60" y="494" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="16" font-weight="600">A lookup after a language switch answers in the language before it.</text>
<text x="60" y="520" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">Key on the key and the language, or keep one array per language; probe P2 and test A.1 hold it.</text>
</g>
</svg>
