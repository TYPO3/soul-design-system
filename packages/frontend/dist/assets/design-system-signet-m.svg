<svg xmlns="http://www.w3.org/2000/svg" id="soul-ref" viewBox="0 0 24 24" role="img" aria-label="Soul Design System">
  <title>Soul Design System</title>
  <!-- Every colour sits on its own shape, as a var() with a hex fallback: a
       page that declares the tokens gets its own ink, and this file still
       renders on its own. Nothing colours it from a <style> or from the root,
       and no comment in here may carry a double dash, which is what makes an
       SVG malformed and a reference to it draw nothing. See
       docs/design-system/artwork.rst. -->
  <!-- M - drawn at 24, where one unit is one pixel. Stroke 2, rounding 1,
       gap 2. The box is 24 x 18, centred; outer corners at radius 3.

       Two pixels of stroke on a 24px mark, the same ink as L carries at 32:
       the smaller the mark, the heavier it is in proportion to itself. That
       weight eats into the opening, so the parts give up what it takes and
       the gaps stay a full stroke, because a gap is the first thing to
       disappear and the last thing that may. -->
  <path stroke="var(--text-primary, #8A8378)" d="M10 20H3A2 2 0 0 1 1 18V11" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
  <rect fill="var(--text-primary, #8A8378)" x="6" y="8" width="2" height="8" rx="1"></rect>
  <rect fill="var(--text-primary, #8A8378)" x="10" y="8" width="4" height="8" rx="1"></rect>
  <rect fill="var(--text-primary, #8A8378)" x="16" y="8" width="2" height="8" rx="1"></rect>
  <path stroke="var(--accent, #FF8700)" d="M14 4H21A2 2 0 0 1 23 6V13" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>
