<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="d-title d-desc">
<title id="d-title">One record, three places it shows</title>
<desc id="d-desc">The server keeps the last thirty reads of a source. The same record shows in three places: as five marks at the end of the source's row on the status page, as a list of reads on the page of the source, and as one line in the terminal. The page of the source is drawn in the accent, because that is where the record lives in full.</desc>
<g id="soul-ref">
<rect width="1200" height="560" fill="var(--surface-canvas, #FBFAF7)"></rect>
<text x="60" y="60" fill="var(--accent, #FF8700)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13" font-weight="600" letter-spacing="1.6">THE RECORD · PART 5</text>
<text x="60" y="108" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">One record, three places it shows</text>
<text x="60" y="140" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="17">The server keeps the last thirty reads of a source. Every place that shows them reads the same file.</text>
<line x1="60" y1="176" x2="1140" y2="176" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></line>
<rect x="60" y="208" width="330" height="240" rx="6" fill="none" stroke="var(--border-strong, #C9C3B7)" stroke-width="1.5"></rect>
<text x="80" y="236" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">THE ROW ON THE STATUS PAGE</text>
<rect x="80" y="252" width="290" height="44" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="96" y="279" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="15" font-weight="600">docs.typo3.org</text>
<rect x="262" y="266" width="14" height="14" rx="3" fill="var(--status-ok, #4F7A3A)"></rect>
<rect x="282" y="266" width="14" height="14" rx="3" fill="var(--status-ok, #4F7A3A)"></rect>
<rect x="302" y="266" width="14" height="14" rx="3" fill="var(--status-warn, #986200)"></rect>
<rect x="322" y="266" width="14" height="14" rx="3" fill="var(--status-ok, #4F7A3A)"></rect>
<rect x="342" y="266" width="14" height="14" rx="3" fill="var(--status-error, #A33328)"></rect>
<text x="80" y="332" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">The last five reads, oldest first.</text>
<text x="80" y="354" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">A mark is a colour and a name, so the row</text>
<text x="80" y="376" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">reads without sight.</text>
<text x="80" y="424" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">a glance</text>
<rect x="435" y="208" width="330" height="240" rx="6" fill="none" stroke="var(--accent, #FF8700)" stroke-width="2"></rect>
<text x="455" y="236" fill="var(--accent, #FF8700)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">THE PAGE OF THE SOURCE</text>
<rect x="455" y="252" width="290" height="32" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<rect x="467" y="261" width="14" height="14" rx="3" fill="var(--status-ok, #4F7A3A)"></rect>
<text x="491" y="273" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">09-15 06:00  read  3m 02s</text>
<rect x="455" y="292" width="290" height="32" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<rect x="467" y="301" width="14" height="14" rx="3" fill="var(--status-error, #A33328)"></rect>
<text x="491" y="313" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">09-14 06:12  stopped  step 2</text>
<rect x="455" y="332" width="290" height="32" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<rect x="467" y="341" width="14" height="14" rx="3" fill="var(--status-ok, #4F7A3A)"></rect>
<text x="491" y="353" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">09-14 00:00  read  2m 58s</text>
<rect x="455" y="372" width="290" height="32" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<rect x="467" y="381" width="14" height="14" rx="3" fill="var(--status-warn, #986200)"></rect>
<text x="491" y="393" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">09-13 18:00  slow  9m 41s</text>
<text x="455" y="424" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">the record in full, thirty reads</text>
<rect x="810" y="208" width="330" height="240" rx="6" fill="none" stroke="var(--border-strong, #C9C3B7)" stroke-width="1.5"></rect>
<text x="830" y="236" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">THE TERMINAL</text>
<rect x="830" y="252" width="290" height="88" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="846" y="280" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">$ dev-companion status docs</text>
<text x="846" y="304" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">30 reads · 27 read · 2 slow</text>
<text x="846" y="328" fill="var(--surface-canvas, #FBFAF7)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">1 stopped · last 06:00 today</text>
<text x="830" y="376" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">One line, for the reader who asks</text>
<text x="830" y="398" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">from a shell and never opens a page.</text>
<text x="830" y="424" fill="var(--text-muted, #726C63)" font-family="&#39;Source Code Pro&#39;,ui-monospace,monospace" font-size="13">a sentence</text>
<line x1="60" y1="476" x2="1140" y2="476" stroke="var(--border-strong, #C9C3B7)" stroke-width="1"></line>
<text x="60" y="510" fill="var(--text-primary, #1C1A17)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="16" font-weight="600">A record of the server's own reads, not a history of a service.</text>
<text x="60" y="536" fill="var(--text-secondary, #4A453D)" font-family="&#39;Source Sans 3&#39;,system-ui,sans-serif" font-size="14">Every read the server made from this machine, and nothing about the source seen from anywhere else.</text>
</g>
</svg>
